const NAVY = '#12395E';
const BLUE = '#1C6DB3';
const GREEN = '#2FAE60';
const WHITE = '#FFFFFF';

function estrela(ctx, cx, cy, tamanho, cor){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = cor;
  ctx.beginPath();
  const pontas = [
    [0,-tamanho],[tamanho*0.18,-tamanho*0.18],[tamanho,0],
    [tamanho*0.18,tamanho*0.18],[0,tamanho],[-tamanho*0.18,tamanho*0.18],
    [-tamanho,0],[-tamanho*0.18,-tamanho*0.18]
  ];
  ctx.moveTo(pontas[0][0], pontas[0][1]);
  for(let i=1;i<pontas.length;i++) ctx.lineTo(pontas[i][0], pontas[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function trianguloRodape(ctx){
  const cores = [NAVY, BLUE, GREEN, BLUE, NAVY, GREEN, BLUE];
  const larguraTri = 1080 / cores.length;
  const altura = 70;
  cores.forEach((cor, i)=>{
    ctx.fillStyle = cor;
    ctx.beginPath();
    if(i % 2 === 0){
      ctx.moveTo(i*larguraTri, 1350);
      ctx.lineTo((i+1)*larguraTri, 1350);
      ctx.lineTo(i*larguraTri, 1350 - altura);
    }else{
      ctx.moveTo(i*larguraTri, 1350);
      ctx.lineTo((i+1)*larguraTri, 1350);
      ctx.lineTo((i+1)*larguraTri, 1350 - altura);
    }
    ctx.closePath();
    ctx.fill();
  });
}

function quebrarTexto(ctx, texto, maxLargura){
  const palavras = texto.split(' ');
  const linhas = [];
  let atual = '';
  palavras.forEach(p=>{
    const teste = atual ? atual + ' ' + p : p;
    if(ctx.measureText(teste).width > maxLargura && atual){
      linhas.push(atual);
      atual = p;
    }else{
      atual = teste;
    }
  });
  if(atual) linhas.push(atual);
  return linhas;
}

function desenharFotoCover(ctx, img){
  const canvasW = 1080, canvasH = 1350;
  const escala = Math.max(canvasW / img.width, canvasH / img.height);
  const w = img.width * escala, h = img.height * escala;
  const x = (canvasW - w) / 2, y = (canvasH - h) / 2 - h * 0.06; // sobe um pouco o foco pra pegar a fachada, não o chão
  ctx.drawImage(img, x, y, w, h);
}

// Fundo "vidro": foto real do campus, um pouco escurecida/borrada (mesmo espírito
// do fundo da tela de login do portal) + gradiente navy por cima pra manter o
// texto legível, com os elementos gráficos (sparkles, triângulos) na frente.
function fundoBase(ctx, sparkleColor, fotoImg){
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, 1080, 1350);

  if(fotoImg){
    ctx.save();
    ctx.filter = 'blur(3px) saturate(1.05)';
    desenharFotoCover(ctx, fotoImg);
    ctx.restore();

    const grad = ctx.createLinearGradient(0, 0, 0, 1350);
    grad.addColorStop(0, 'rgba(18,57,94,0.80)');
    grad.addColorStop(0.55, 'rgba(18,57,94,0.72)');
    grad.addColorStop(1, 'rgba(10,28,48,0.94)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1350);
  }

  estrela(ctx, 130, 260, 26, sparkleColor);
  estrela(ctx, 940, 180, 18, sparkleColor);
  estrela(ctx, 90, 620, 16, sparkleColor);
  estrela(ctx, 980, 900, 22, sparkleColor);
  trianguloRodape(ctx);
}

// Cartão branco com a logo OFICIAL da UniFECAF (mesma imagem usada nos PDFs) —
// nunca recriada à mão, pra não sair do padrão de marca.
function logoCard(ctx, x, y, logoImg){
  ctx.fillStyle = WHITE;
  const w = 260, h = 74;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 16);
  ctx.fill();
  if(logoImg){
    const padding = 14;
    const alturaLogo = h - padding * 2;
    const larguraLogo = alturaLogo * (logoImg.width / logoImg.height);
    ctx.drawImage(logoImg, x + padding, y + padding, larguraLogo, alturaLogo);
  }
}

function seloTopo(ctx, texto, x, y){
  ctx.font = '700 26px Poppins';
  const largura = ctx.measureText(texto).width + 48;
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.roundRect(x, y, largura, 56, 28);
  ctx.fill();
  ctx.fillStyle = WHITE;
  ctx.textBaseline = 'middle';
  ctx.fillText(texto, x + 24, y + 29);
}

function truncarTexto(texto, maxChars){
  texto = String(texto || '').trim();
  if(texto.length <= maxChars) return texto;
  return texto.slice(0, maxChars - 1).trim() + '…';
}

function caixaDestaque(ctx, texto, cor, y0, fontSizePx){
  fontSizePx = fontSizePx || 52;
  ctx.font = '800 ' + fontSizePx + 'px Poppins';
  const maxLargura = 900;
  const linhas = quebrarTexto(ctx, texto, maxLargura);
  const linhaAltura = Math.round(fontSizePx * 1.23);
  const padY = Math.round(fontSizePx * 0.85);
  const altura = linhas.length * linhaAltura + padY * 2;
  const largura = 940;
  const x = (1080 - largura) / 2;
  ctx.fillStyle = cor;
  ctx.beginPath();
  ctx.roundRect(x, y0, largura, altura, 24);
  ctx.fill();
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  linhas.forEach((linha, i)=>{
    ctx.fillText(linha, x + 40, y0 + padY + i * linhaAltura);
  });
  return y0 + altura;
}

function rodapeAtribuicao(ctx, curso, coordenador){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#B9C1D6';
  ctx.font = '600 30px "Work Sans"';
  ctx.fillText(curso, 540, 1170);
  ctx.font = '500 24px "Work Sans"';
  ctx.fillText('Coordenação: ' + coordenador, 540, 1206);
}

// ---------- SLIDE 1: CAPA ----------
function desenharCapa(ctx, dados){
  fundoBase(ctx, 'rgba(255,255,255,0.85)', dados.foto);
  logoCard(ctx, 60, 60, dados.logo);
  seloTopo(ctx, 'RESULTADO DA CPA', 60, 170);

  ctx.fillStyle = WHITE;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 64px Poppins';
  const linhas1 = quebrarTexto(ctx, 'Você respondeu a CPA.', 940);
  let y = 420;
  linhas1.forEach(l=>{ ctx.fillText(l, 60, y); y += 74; });

  ctx.fillStyle = '#DCE7F5';
  ctx.font = '600 40px "Work Sans"';
  const linhas2 = quebrarTexto(ctx, 'Isso é o que fizemos com a sua resposta.', 940);
  y += 20;
  linhas2.forEach(l=>{ ctx.fillText(l, 60, y); y += 52; });

  ctx.fillStyle = GREEN;
  ctx.font = '800 46px Poppins';
  ctx.fillText(dados.curso, 60, y + 60);
  ctx.fillStyle = '#B9C1D6';
  ctx.font = '500 30px "Work Sans"';
  ctx.fillText('Coordenação: ' + dados.coordenador, 60, y + 104);
}

// ---------- SLIDE: UM ITEM (problema + solução juntos, mais denso) ----------
function desenharItem(ctx, dados){
  fundoBase(ctx, 'rgba(255,255,255,0.75)', dados.foto);
  logoCard(ctx, 60, 60, dados.logo);
  seloTopo(ctx, 'RESULTADO DA CPA', 60, 170);

  ctx.fillStyle = WHITE;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 44px Poppins';
  let y = 400;
  quebrarTexto(ctx, dados.curso, 940).forEach(l=>{ ctx.fillText(l, 60, y); y += 52; });
  y += 30;

  ctx.fillStyle = '#9FC3EE';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 28px "Work Sans"';
  ctx.fillText('🔍 O QUE OS ALUNOS DISSERAM', 60, y);
  y += 22;
  y = caixaDestaque(ctx, truncarTexto(dados.problema, 130), BLUE, y, 36);
  y += 40;

  ctx.fillStyle = '#A9E8C4';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 28px "Work Sans"';
  ctx.fillText('✅ NOSSO PLANO DE AÇÃO', 60, y);
  y += 22;
  caixaDestaque(ctx, truncarTexto(dados.solucao, 130), GREEN, y, 36);

  rodapeAtribuicao(ctx, dados.curso, dados.coordenador);
}

// ---------- SLIDE 4: ENCERRAMENTO ----------
function desenharEncerramento(ctx, dados){
  fundoBase(ctx, 'rgba(255,255,255,0.85)', dados.foto);
  logoCard(ctx, (1080-260)/2, 480, dados.logo);

  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.font = '700 44px Poppins';
  quebrarTexto(ctx, 'Esse plano passa pela Coordenação, pela CPA e pela Direção da Faculdade.', 780)
    .forEach((l,i)=>ctx.fillText(l, 540, 660 + i*56));

  ctx.fillStyle = GREEN;
  ctx.font = '800 40px Poppins';
  ctx.fillText('Seu sonho, nossa meta!', 540, 900);
}

function carregarImagem(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function main(){
  await document.fonts.load('800 64px Poppins');
  await document.fonts.load('600 40px "Work Sans"');
  await document.fonts.ready;
  const foto = await carregarImagem(CAMPUS_FACHADA_B64);
  const logo = await carregarImagem(LOGO_UNIFECAF_B64);

  desenharCapa(document.getElementById('c-capa').getContext('2d'), {
    curso: 'Odontologia', coordenador: 'Profa. Maria Silva', foto, logo
  });
  desenharItem(document.getElementById('c-problema').getContext('2d'), {
    curso: 'Odontologia', coordenador: 'Profa. Maria Silva', foto, logo,
    problema: 'Falta de horários de atendimento no laboratório em turnos alternativos, principalmente pra quem trabalha durante o dia.',
    solucao: 'Ampliação do horário dos laboratórios para os períodos noturno e sábado, começando já no próximo semestre.'
  });
  desenharEncerramento(document.getElementById('c-fim').getContext('2d'), { foto, logo });

  window.PRONTO = true;
}
main();
</script>
